spring.application.name=cruddemo

#database

spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#turn of spring login banner

spring.main.banner-mode = off

#reduce login level set login level to warn
logging.level.root=warn

#add login config to display sql statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

#configure JPA/Hibernate to auto-create the table
#the update config will keep the existing data in the table
spring.jpa.hibernate.ddl-auto=update